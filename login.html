<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniShare - Login</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section><div class="container">
  <h1 class="section-title" style="text-align:center">Student <span>Login</span></h1>
  <div class="form-box" style="max-width:420px">
    <label for="loginEmail">Email</label><input type="text" id="loginEmail">
    <label for="loginPass">Password</label><input type="password" id="loginPass">
    <div class="btn-row"><button class="btn" onclick="loginUser()">Login</button></div>
    <p id="loginMsg" class="msg"></p>
    <p class="note">Demo account: <b>demo@example.edu</b> / <b>demo123</b></p>
    <p class="note">New here? <a href="register.html">Create an account</a></p>
    <p class="note">This is a frontend demo. Login is stored in your browser only and is not secure.</p>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
